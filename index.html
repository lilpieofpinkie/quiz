<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Night</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="game">

    <header class="game-header">

        <div class="brand">
            <div class="brand-label">QUIZ NIGHT</div>
            <h1>Вечер вопросов</h1>
        </div>

        <div class="header-actions">
            <button
                id="surrender-game"
                class="surrender-button"
                type="button"
            >
                Сдаться
            </button>

            <button
                id="new-game"
                class="new-game-button"
                type="button"
            >
                Новая игра
            </button>
        </div>

    </header>


    <section class="scores">

        <div class="team-score team-tush">

            <div class="team-info">
                <input
                    id="team-name-tush"
                    class="team-name-input"
                    type="text"
                    maxlength="18"
                    value="ТУШЬ"
                    autocomplete="off"
                    spellcheck="false"
                >

                <span class="team-hint">
                    название команды
                </span>
            </div>

            <div
                id="score-tush"
                class="team-points"
            >
                0
            </div>

        </div>


        <div class="round-label">

            <span id="round-number">
                ROUND 00
            </span>

            <small>
                ВОПРОС
            </small>

        </div>


        <div class="team-score team-font">

            <div class="team-info">
                <input
                    id="team-name-font"
                    class="team-name-input"
                    type="text"
                    maxlength="18"
                    value="ШРИФТ"
                    autocomplete="off"
                    spellcheck="false"
                >

                <span class="team-hint">
                    название команды
                </span>
            </div>

            <div
                id="score-font"
                class="team-points"
            >
                0
            </div>

        </div>

    </section>


    <section
        id="game-board"
        class="game-board"
    ></section>


    <footer class="game-footer">

        <span>
            Выберите стоимость вопроса
        </span>

        <span id="questions-left">
            30 вопросов осталось
        </span>

    </footer>

</main>


<!-- QUESTION MODAL -->

<div
    id="question-modal"
    class="modal hidden"
>

    <div class="modal-overlay"></div>

    <div class="modal-content">

        <div class="question-header">

            <div>

                <span id="question-category">
                    Категория
                </span>

                <div class="question-number">
                    ВОПРОС
                </div>

            </div>

            <strong id="question-points">
                0
            </strong>

        </div>


        <div class="question-body">

            <h2 id="question-text">
                Вопрос
            </h2>

        </div>


        <div
            id="answer"
            class="answer hidden"
        >

            <div class="answer-label">
                ОТВЕТ
            </div>

            <p id="answer-text"></p>

        </div>


        <div class="question-actions">

            <button
                id="show-answer"
                class="primary-action"
                type="button"
            >
                Показать ответ
            </button>


            <div class="team-actions">

                <button
                    id="correct-tush"
                    class="team-answer team-answer-tush hidden"
                    type="button"
                >
                    <span id="correct-tush-name">ТУШЬ</span>
                    <span>+</span>
                </button>


                <button
                    id="correct-font"
                    class="team-answer team-answer-font hidden"
                    type="button"
                >
                    <span id="correct-font-name">ШРИФТ</span>
                    <span>+</span>
                </button>

            </div>


            <button
                id="wrong-answer"
                class="secondary-action hidden"
                type="button"
            >
                Неправильно
            </button>


            <button
                id="close-modal"
                class="close-action"
                type="button"
            >
                Закрыть
            </button>

        </div>

    </div>

</div>


<!-- GAME OVER -->

<div
    id="game-over-modal"
    class="modal hidden"
>

    <div class="modal-overlay"></div>

    <div class="game-over-content">

        <div
            id="game-over-label"
            class="game-over-label"
        >
            ИГРА ЗАВЕРШЕНА
        </div>

        <h2 id="winner-title">
            Победитель
        </h2>

        <div class="final-score">

            <div class="final-team">

                <span id="final-team-name-tush">
                    ТУШЬ
                </span>

                <strong id="final-score-tush">
                    0
                </strong>

            </div>


            <div class="final-divider">
                :
            </div>


            <div class="final-team">

                <span id="final-team-name-font">
                    ШРИФТ
                </span>

                <strong id="final-score-font">
                    0
                </strong>

            </div>

        </div>


        <button
            id="restart-game"
            class="primary-action"
            type="button"
        >
            Новая игра
        </button>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
